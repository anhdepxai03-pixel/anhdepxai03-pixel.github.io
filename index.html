<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Bế Nguyễn Hùng Cường | Trang cá nhân chính thức</title>
    <meta name="description" content="Hình ảnh, video và trang thông tin cá nhân chính thức của Bế Nguyễn Hùng Cường. Kênh TikTok @benguyenhungcuong #benguyenhungcuong.">
    <meta name="keywords" content="Bế Nguyễn Hùng Cường, benguyenhungcuong, #benguyenhungcuong, Be Nguyen Hung Cuong">
    <meta name="robots" content="index, follow">

    <meta property="og:title" content="Bế Nguyễn Hùng Cường | Trang cá nhân chính thức">
    <meta property="og:description" content="Hồ sơ và nội dung chính thức của Bế Nguyễn Hùng Cường (@benguyenhungcuong)">
    <meta property="og:image" content="https://anhdepxai03-pixel.github.io/be-nguyen-hung-cuong.jpg">
    <meta property="og:url" content="https://anhdepxai03-pixel.github.io">
    <meta property="og:type" content="profile">

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Bế Nguyễn Hùng Cường",
      "alternateName": ["benguyenhungcuong", "Be Nguyen Hung Cuong"],
      "url": "https://anhdepxai03-pixel.github.io",
      "image": {
        "@type": "ImageObject",
        "url": "https://anhdepxai03-pixel.github.io/be-nguyen-hung-cuong.jpg",
        "caption": "Bế Nguyễn Hùng Cường"
      },
      "sameAs": [
        "https://www.tiktok.com/@benguyenhungcuong",
        "https://www.tiktok.com/tag/benguyenhungcuong"
      ]
    }
    </script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f141c;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            max-width: 450px;
            width: 100%;
            background: #1a2230;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
            text-align: center;
        }
        h1 {
            font-size: 1.5rem;
            margin: 12px 0 4px;
        }
        p.subtitle {
            color: #8da2be;
            font-size: 0.95rem;
            margin-bottom: 20px;
        }
        .media-box {
            margin-bottom: 20px;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
        }
        img, video {
            width: 100%;
            display: block;
            border-radius: 12px;
        }
        .tiktok-link-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
        }
        .tiktok-btn {
            display: block;
            background: #fe2c55;
            color: #ffffff;
            text-decoration: none;
            padding: 12px 20px;
            border-radius: 24px;
            font-weight: 600;
            font-size: 0.95rem;
            transition: opacity 0.2s;
        }
        .hashtag-btn {
            display: block;
            background: #252e3e;
            color: #25f4ee;
            border: 1px solid #25f4ee;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 24px;
            font-weight: 600;
            font-size: 0.9rem;
        }
        .tiktok-btn:hover, .hashtag-btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <main class="container">
        <h1>Bế Nguyễn Hùng Cường</h1>
        <p class="subtitle">@benguyenhungcuong • #benguyenhungcuong</p>

        <div class="media-box">
            <img 
                src="be-nguyen-hung-cuong.jpg" 
                alt="Bế Nguyễn Hùng Cường" 
                title="Bế Nguyễn Hùng Cường"
            >
        </div>

        <div class="media-box">
            <video controls playsinline>
                <source src="be-nguyen-hung-cuong-meme.mp4" type="video/mp4">
                Trình duyệt không hỗ trợ phát video này.
            </video>
        </div>

        <div class="tiktok-link-group">
            <a 
                class="tiktok-btn" 
                href="https://www.tiktok.com/@benguyenhungcuong" 
                target="_blank" 
                rel="noopener"
            >
                Ghé thăm TikTok @benguyenhungcuong
            </a>
            <a 
                class="hashtag-btn" 
                href="https://www.tiktok.com/tag/benguyenhungcuong" 
                target="_blank" 
                rel="noopener"
            >
                Khám phá video hashtag #benguyenhungcuong
            </a>
        </div>
    </main>

</body>
</html>
